<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Sample attachment thumbnail: gel scan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F2EA" />
      <stop offset="100%" stop-color="#FFF7EC" />
    </linearGradient>
    <linearGradient id="gel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15151A" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#15151A" stop-opacity="0.82" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#bg)" />

  <rect x="78" y="78" width="1044" height="644" rx="22" fill="#FFFFFF" stroke="#15151A" stroke-width="10" />

  <g transform="translate(140 150)">
